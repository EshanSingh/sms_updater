[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testudo-watch"
version = "0.1.0"
description = "Watch UMD Testudo for open seats in course sections and get notified."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "twilio>=9.0",
    "python-dotenv>=1.0",
    "starlette>=1.6",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
testudo-watch = "testudo_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testudo_watch = ["templates/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:The 'strip_cdata' option:DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
